spring:
  application:
    name: wayfinder-guild

  datasource:
    # 数据库连接（敏感信息请使用环境变量或 application-local.yml，勿提交到 Git）
    url: ${DB_URL:jdbc:postgresql://localhost:5432/your_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      # Non-secret placeholder keeps public Demo Mode bootable; set DEEPSEEK_API_KEY for Owner Live Mode.
      api-key: ${DEEPSEEK_API_KEY:demo-disabled}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
server:
  port: 8123
  servlet:
    context-path: /api
search:
  provider: ${SEARCH_PROVIDER:disabled}

tavily:
  api-key: ${TAVILY_API_KEY:}

# Pexels 图片搜索（SyManus 搜索/下载图片用）
pexels:
  api-key: ${PEXELS_API_KEY:}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI:INFO}
    com.seewhy.syaiagent: ${LOGGING_LEVEL_COM_SEEWHY_SYAIAGENT:INFO}

wayfinder:
  demo:
    enabled: ${WAYFINDER_DEMO_ENABLED:true}
  security:
    owner-token: ${WAYFINDER_OWNER_TOKEN:}
  cors:
    allowed-origin-patterns: ${WAYFINDER_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

travel:
  rag:
    # Public production default avoids PgVector/cloud database cost.
    # Supported values: demo, lightweight, pgvector.
    mode: ${TRAVEL_RAG_MODE:demo}
